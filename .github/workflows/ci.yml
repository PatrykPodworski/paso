name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm build
      - run: pnpm test

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stryker re-mutates only what changed since the restored run, so a typical pull
      # request costs seconds. A cold cache falls back to a full run.
      - uses: actions/cache@v4
        with:
          path: reports/stryker-business-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: stryker-
      - run: pnpm test:mutation

  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # audit compares against the merge-base with main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec fallow audit

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .cache/playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: PLAYWRIGHT_BROWSERS_PATH=.cache/playwright pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .cache/playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: PLAYWRIGHT_BROWSERS_PATH=.cache/playwright pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --reporter=list,html --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
