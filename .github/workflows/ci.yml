name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stryker re-mutates only what changed since the restored run, so a typical pull
      # request costs seconds. A cold cache falls back to a full run.
      - uses: actions/cache@v4
        with:
          path: reports/stryker-business-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: stryker-
      - run: pnpm test:mutation

  visual:
    runs-on: ubuntu-latest
    permissions:
      # Lets the Argos SDK exchange the GitHub Actions OIDC token for an Argos one,
      # so no ARGOS_TOKEN secret has to be created or rotated.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Argos resolves the baseline build from git history; a shallow clone hides it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .cache/playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: PLAYWRIGHT_BROWSERS_PATH=.cache/playwright pnpm exec playwright install --with-deps chromium
      # ARGOS_UPLOAD switches the shared capture helper from the committed macOS
      # baselines to argosScreenshot, and arms the reporter's upload. The committed
      # PNGs are never compared here: they are the local gate and are macOS arm64,
      # while Argos compares against baselines it generated on this same runner.
      - run: pnpm test:visual
        env:
          ARGOS_UPLOAD: "1"
