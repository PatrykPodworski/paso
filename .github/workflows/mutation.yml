name: Mutation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      # The cache is keyed by commit and saved only after a passing run, so an exact hit
      # means main has not changed since the last nightly run and the job can stop here.
      - id: cache
        uses: actions/cache@v4
        with:
          path: reports/stryker-business-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: stryker-
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      # Stryker re-mutates only what changed since the restored run. A cold cache falls
      # back to a full run.
      - if: steps.cache.outputs.cache-hit != 'true'
        # Explicit bash adds pipefail, so tee does not hide a failing run.
        shell: bash
        run: pnpm test:mutation | tee mutation.log
      # Only a score below the break threshold opens an issue; other failures show up as a
      # red run. One open issue at a time: later failures comment on it.
      - if: failure() && hashFiles('mutation.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          line=$(grep -m1 "under breaking threshold" mutation.log) || exit 0
          body="$line on $GITHUB_SHA. Run: $RUN_URL"
          open=$(gh issue list --state open --search "in:title Nightly mutation score below threshold" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Nightly mutation score below threshold" --body "$body"
          fi
