name: Visual cleanup

# Removes a closed pull request's visual report from GitHub Pages.
on:
  pull_request:
    types: [closed]

jobs:
  remove-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: .github/scripts/pages.sh "pr-${{ github.event.number }}"
