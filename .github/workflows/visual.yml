name: Visual

# Compares the pull request's screenshots with the base branch's. Both sets are taken in
# this job, in the same container, so fonts and the browser match and no baseline is
# stored anywhere. The visual-approved label accepts the diff of the current commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  compare:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      VISUAL_COMPARE: "1"
    outputs:
      outcome: ${{ steps.compare.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          # HEAD is the merge commit; HEAD^1 is the tip of the base branch.
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pull request's tests drive the base's app, so only app changes show up as a
      # diff. A base test that fails leaves its snapshots missing, and the compare step
      # reports them.
      - name: Capture the base
        # The container runs as root, but the runner owns the checkout, so git refuses it.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git restore --source=HEAD^1 --worktree -- src public index.html
          pnpm exec playwright test tests/visual --update-snapshots=all || true
          git restore --worktree -- src public index.html
      - name: Compare with the base
        id: compare
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: visual-results.json
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright test tests/visual --update-snapshots=none --reporter=list,html,json
      - name: Summarize the diff
        if: steps.compare.outcome == 'failure'
        run: |
          node - <<'EOF' > changed.md
          const { suites } = require("./visual-results.json");
          const strip = (text) => text.replace(/\x1b\[[0-9;]*m/g, "");
          console.log("### Changed screenshots\n");
          const walk = (suite) => {
            for (const spec of suite.specs ?? [])
              for (const test of spec.tests.filter(({ status }) => status === "unexpected")) {
                const message = strip(test.results.at(-1).errors[0]?.message ?? "");
                const snapshot = message.match(/Snapshot: (\S+)/)?.[1];
                const pixels = message.match(/(\d+) pixels \(ratio [\d.]+ of all image pixels\)/)?.[0];
                const detail = pixels ?? message.split("\n")[0];
                console.log(`- ${test.projectName} › ${spec.title}${snapshot ? ` › ${snapshot}` : ""}: ${detail}`);
              }
            (suite.suites ?? []).forEach(walk);
          };
          suites.forEach(walk);
          EOF
          cat changed.md >> "$GITHUB_STEP_SUMMARY"
      # The publish job runs outside the container, where gh is available.
      - uses: actions/upload-artifact@v4
        if: steps.compare.outcome == 'failure'
        with:
          name: visual-diff
          retention-days: 1
          path: |
            playwright-report/
            changed.md
      - name: Require approval
        if: >-
          steps.compare.outcome == 'failure' && (github.event.action == 'synchronize' ||
          !contains(github.event.pull_request.labels.*.name, 'visual-approved'))
        run: |
          echo "::error::Screenshots differ from the base; the job summary lists them. Open the report linked in the pull request comment, then add the visual-approved label to accept the diff."
          exit 1

  # Publishes the report to GitHub Pages under pr-<number>/ and keeps one comment on the
  # pull request that links it, or says there is no difference.
  publish:
    needs: compare
    if: always() && contains(fromJSON('["success", "failure"]'), needs.compare.outputs.outcome)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.number }}
      MARKER: "<!-- visual-report -->"
    steps:
      - uses: actions/checkout@v5
        if: needs.compare.outputs.outcome == 'failure'
      - uses: actions/download-artifact@v5
        if: needs.compare.outputs.outcome == 'failure'
        with:
          name: visual-diff
          path: visual-diff
      - name: Publish the report
        if: needs.compare.outputs.outcome == 'failure'
        run: .github/scripts/pages.sh "pr-$NUMBER" visual-diff/playwright-report
      - name: Comment on the pull request
        env:
          OUTCOME: ${{ needs.compare.outputs.outcome }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: https://patrykpodworski.github.io/paso/pr-${{ github.event.number }}/
        run: |
          id=$(gh api "repos/$GH_REPO/issues/$NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n 1)
          if [ "$OUTCOME" = failure ]; then
            body="$MARKER"$'\n'"Screenshots of $SHA differ from the base. [Open the report]($URL) (it can take a minute to deploy)."$'\n\n'"$(cat visual-diff/changed.md)"
          elif [ -n "$id" ]; then
            body="$MARKER"$'\n'"Screenshots of $SHA match the base; there are no differences."
          else
            exit 0
          fi
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$NUMBER" --body "$body"
          fi

  # A new commit needs a new approval. The container above has no gh.
  reset-approval:
    if: >-
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'visual-approved')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit ${{ github.event.number }} --remove-label visual-approved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
